<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Video Console 控制台">
    <title>Video Console</title>
    <link rel="stylesheet" href="/ui/styles.css">
    <script defer src="/ui/console.js"></script>
</head>
<body class="console-page">
    <div class="app-shell">
        <header class="app-header">
            <div class="app-title">
                <h1>Video Console</h1>
                <p>视频下载与处理</p>
            </div>
            <div class="status-bar" aria-label="服务状态">
                <span id="server-status">空闲</span>
                <span id="api-status">等待加载</span>
                <button class="button button-quiet" type="button" id="logout-btn">退出</button>
            </div>
        </header>

        <main class="main-grid">
            <section class="section task-section" aria-labelledby="task-title">
                <header class="section-header">
                    <h2 id="task-title">新任务</h2>
                    <div class="task-code">
                        <span id="task-id">#000000</span>
                        <button class="button button-small" type="button" id="regen-code">换编号</button>
                    </div>
                </header>

                <form id="task-form" class="task-form">
                    <label class="field origin-field">
                        <span>来源</span>
                        <select id="origin-select"></select>
                    </label>

                    <label class="field field-full">
                        <span>编号或链接</span>
                        <textarea id="input-text" placeholder="例如：123-1-1 或完整 URL"></textarea>
                    </label>

                    <label class="field file-field">
                        <span>文件名</span>
                        <input id="file-input" type="text" placeholder="留空自动生成">
                    </label>

                    <label class="field plugin-field">
                        <span>插件</span>
                        <select id="mod-select"></select>
                    </label>

                    <label class="field resolution-field">
                        <span>分辨率</span>
                        <select id="resolution-select"></select>
                    </label>

                    <label class="field field-full source-field">
                        <span>实际来源</span>
                        <input id="source-preview" type="text" readonly>
                    </label>

                    <div class="task-actions field-full">
                        <button class="button button-primary" type="submit">开始下载</button>
                        <button class="button" type="button" id="stop-btn">停止任务</button>
                        <button class="button" type="button" id="clear-log-btn">清空日志</button>
                        <button class="button button-danger" type="button" id="clear-output-btn">清空输出</button>
                    </div>
                </form>
            </section>

            <section class="section log-section" aria-labelledby="log-title">
                <header class="section-header">
                    <h2 id="log-title">运行日志</h2>
                    <button class="button button-small" type="button" id="refresh-state">刷新</button>
                </header>
                <pre id="log-view" class="log-view" aria-live="polite">正在初始化...</pre>
            </section>

            <section class="section files-section" aria-labelledby="files-title">
                <header class="section-header">
                    <h2 id="files-title">输出文件</h2>
                    <button class="button button-small" type="button" id="refresh-files">刷新</button>
                </header>
                <div id="file-list" class="item-list"></div>
            </section>

            <section class="section templates-section" aria-labelledby="templates-title">
                <header class="section-header">
                    <h2 id="templates-title">来源模板</h2>
                </header>
                <div id="template-list" class="item-list"></div>
            </section>
        </main>
    </div>
</body>
</html>
