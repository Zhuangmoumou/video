<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Video Console 登录页">
    <title>登录 · Video Console</title>
    <link rel="stylesheet" href="/ui/styles.css">
    <script defer src="/ui/login.js"></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-box" aria-labelledby="login-title">
            <header class="login-heading">
                <h1 id="login-title">Video Console</h1>
                <p>输入访问密码</p>
            </header>

            <form id="auth-form" class="auth-form">
                <label class="field">
                    <span>密码</span>
                    <input id="auth-password" type="password" autocomplete="current-password" placeholder="访问密码">
                </label>
                <button id="auth-submit" class="button button-primary auth-submit" type="submit">登录</button>
                <p id="auth-feedback" class="auth-feedback" data-tone="muted" aria-live="polite">正在检查访问权限...</p>
            </form>
        </section>
    </main>
</body>
</html>
